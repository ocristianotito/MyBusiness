<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financeiro · Cristiano Convites</title>
<style>
:root{--bg:#0b1118;--pn:#131b25;--pn2:#18222e;--bd:#233140;--tx:#e8eef5;--mu:#8a97a8;--teal:#2bb5a6;--g:#34d399;--o:#f6ad3b;--r:#f87171;--p:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 24px 0;border-bottom:1px solid var(--bd);background:#0e151d;position:sticky;top:0;z-index:5}
header h1{margin:0 0 10px;font-size:18px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
nav button.on{color:var(--teal);border-color:var(--teal)}
main{padding:24px;max-width:1500px;margin:auto}
h2{margin:0 0 16px;font-size:22px}
h3{margin:0 0 12px;font-size:16px}
.mu,.note,small{color:var(--mu)}
.note{font-size:12px}
.t{color:var(--teal)}.g{color:var(--g)}.o{color:var(--o)}.r{color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi small{display:block;font-size:12px}
.kpi b{display:block;font-size:20px;margin-top:6px}
.kpi em{display:block;font-size:11px;color:var(--mu);font-style:normal;margin-top:4px}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:20px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:14px;overflow-x:auto;align-items:start;margin-bottom:24px;padding-bottom:6px}
.col{background:#0f1620;border:1px solid var(--bd);border-radius:12px;padding:12px;min-height:120px}
.col.over{outline:2px dashed var(--teal)}
.col h4{margin:0 0 10px;display:flex;justify-content:space-between;font-size:14px}
.col h4 em{font-style:normal;color:var(--mu);font-weight:400}
.cardk{position:relative;background:var(--pn2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
.cardk[draggable=true]{cursor:grab}
.cardk.drag{opacity:.4}
.cardk.quit{opacity:.5}
.cardk h5{margin:6px 0 2px;font-size:15px;padding-right:24px}
.cardk .up{text-transform:uppercase}
.amt{font-size:20px;font-weight:700;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;margin-right:4px}
.tag.pp{background:#2d2250;color:var(--p)}
.tag.ok{background:#12372b;color:var(--g)}
.tag.calc{background:#1b2633;color:var(--mu)}
.xdel{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--r);font-size:16px;font-weight:700;cursor:pointer;padding:2px 6px;line-height:1}
.xdel.s{position:static}
.xdel:hover{background:#3a1d22;border-radius:6px}
.prog{height:8px;background:#0b1118;border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--teal);border-radius:6px}
.btn{background:var(--teal);color:#06201d;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;margin:8px 0 0}
.btn.full{width:100%}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:#1b2633;color:var(--tx);border:1px solid var(--bd)}
.btn.danger{background:#3a1d22;color:var(--r)}
.btn.sp{margin-right:auto}
.btn:hover{filter:brightness(1.12)}
.tw{overflow-x:auto;padding:0}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;color:var(--mu)}
tfoot td{font-weight:700;background:#0f1620}
.cbtns{display:flex;gap:6px}
.yr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--teal)}
.yr h3{margin:0;font-size:22px;color:var(--teal)}
.yr span{color:var(--mu);font-size:13px}
.ysub{font-weight:700;color:var(--teal);margin:8px 0}
.sec{margin:28px 0 12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.dlg.pt{max-width:640px}
.dlg h2{margin:0;font-size:20px}
.sub{color:var(--mu);margin:2px 0 14px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.info>div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
.info small{display:block;font-size:11px}
.info b{display:block;font-size:16px;margin-top:3px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:12px;color:var(--mu)}
label.full{grid-column:1/-1}
input,select{width:100%;margin-top:4px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit}
input:focus,select:focus{outline:2px solid var(--teal);border-color:transparent}
.orow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.orow label{min-width:130px;flex:0 1 170px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mscroll{overflow-x:auto;margin-top:12px}
.mscroll input{width:110px;text-align:right;margin:0;padding:6px 8px}
.mscroll td.tt{font-weight:700;color:var(--teal)}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.lbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lbtns .btn{margin:0}
.lhead{margin-bottom:14px}
.lw{overflow-x:auto;border-radius:12px;background:#eef4f4}
.lt{width:auto;min-width:100%;color:#17323a}
.lt th{background:#dfeaeb;color:#2c4a50;border-bottom:3px solid #b7c8ca}
.lt th.q{background:#d3f3ef;border-color:#14b8a6}
.lt th.v{background:#e7e0fb;border-color:#8b5cf6}
.lt th.m{background:#dcf5e3;border-color:#22c55e}
.lt th.s{background:#fde8c8;border-color:#f59e0b}
.lt td{border-bottom:1px solid #d4e0e0;padding:6px}
.lt input{background:#fff;color:#17323a;border:1px solid #bcd0d0;margin:0;padding:8px;min-width:90px}
.lt input.nm{min-width:240px}
.lt input.n{text-align:right}
.lt input.b{font-weight:700}
.lt input.g{color:#15803d;font-weight:600}
.lt input.ovr{background:#fff3b0;border-color:#e0b100}
.lt td.o{color:#b45309;font-weight:600;text-align:right}
.lt tfoot td{background:#dfeaeb;color:#17323a;text-align:right}
.bd{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}
.bd.w{background:#ffedd5;color:#b45309;border-color:#f59e0b}
.bd.ok{background:#dcfce7;color:#15803d;border-color:#22c55e}
.bd.x{background:#dbeafe;color:#1d4ed8;border-color:#3b82f6}
.brow{display:grid;grid-template-columns:200px 1fr 130px;gap:10px;align-items:center;margin:8px 0}
@media(max-width:700px){.fg,.info{grid-template-columns:1fr}.brow{grid-template-columns:1fr}main{padding:14px}}
.lt td.cmc{position:relative}.cmb{position:absolute;left:1px;top:1px;border:0;background:transparent;font-size:10px;line-height:1;padding:1px 2px;cursor:pointer;opacity:.28}.lt tr:hover .cmb,.cmb:focus{opacity:1}.hascm .cmb{opacity:.9}
.hascm::after{content:"";position:absolute;top:0;right:0;border-top:10px solid #e11d48;border-left:10px solid transparent;pointer-events:none}
.cmtip{display:none;position:absolute;z-index:40;top:100%;right:0;min-width:170px;max-width:270px;background:#fffbe0;border:1px solid #d6c86a;color:#222;padding:8px 10px;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:pre-wrap;font-size:12px;line-height:1.45;text-align:left;font-weight:400}.hascm:hover .cmtip{display:block}
.lhead{position:sticky;top:var(--hh,64px);z-index:4;background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.ltitle{display:flex;gap:8px;flex-wrap:wrap}.ltitle input{background:transparent;border:1px solid transparent;border-bottom:1px dashed var(--bd);border-radius:6px;font-weight:700;font-size:22px;line-height:1.2;color:var(--tx);padding:2px 6px;width:auto}.ltitle input:hover,.ltitle input:focus{border-color:var(--teal);background:var(--card2);outline:0}.ltitle input[data-lt=curso]{min-width:240px;flex:1;max-width:520px}.ltitle input.per{width:110px}
.lsub{width:170px;padding:3px 8px;font-size:13px}
.lw{overflow:auto;max-height:calc(100vh - var(--hh,64px) - var(--lh,90px) - 14px - var(--lb,40px))}.lt th{position:sticky;top:0;z-index:3}
.lt tr:focus-within>td{background:#cdeee6!important;transition:background .12s}.lt tr:focus-within>td:first-child{box-shadow:inset 5px 0 0 #14b8a6}.lt tr:focus-within input:not(:focus){background:#eefaf6;border-color:#9fd8cc}.lt tr:focus-within input:focus{background:#fff;border-color:#0d9488;box-shadow:0 0 0 2px #5eead466;outline:0}
@media print{body>*:not(#relov){display:none!important}#relov{position:static!important;background:#fff!important;overflow:visible!important}#relov .rbar{display:none!important}#relov>div:not(.rbar){max-width:none!important;margin:0!important;padding:0!important}@page{size:A4 landscape;margin:12mm}}
</style>

<style>
header{padding-top:12px}
.appbar{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.finicon{width:36px;height:36px;border-radius:10px;background:#13262a;color:var(--teal);display:inline-flex;align-items:center;justify-content:center}
.fintit h1{margin:0;font-size:18px}.fintit small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.modsw{display:flex;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.modsw button{background:none;border:0;color:var(--mu);padding:6px 14px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.modsw button:hover{color:var(--tx)}
.modsw button.on{background:var(--teal);color:#06201d}
.appsp{flex:1}
.appsave{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}
.appsave i{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block}
.appsave.busy i{background:var(--o)}.appsave.err i{background:var(--r)}
.appmenuwrap{position:relative}
.appmenu.sidemenu{position:fixed;left:16px;bottom:64px;top:auto;right:auto}
#side .appsave{width:100%;padding:0 4px}
.appmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:6px;min-width:290px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.appmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:9px 10px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
.appmenu button:hover{background:var(--pn2)}
</style>
<script>var RODAPE='<span class="sync appsave" id="appsave"><i></i><span>Salvo no computador</span></span><div class="appmenuwrap"><button class="sbtn" id="appBk" aria-haspopup="true">Backup</button><div class="appmenu sidemenu" id="appMenu" hidden><button data-bk="export">Exportar backup (tudo)…</button><button data-bk="import">Importar backup…</button><button data-bk="pasta">Abrir pasta de backups automáticos</button><button data-bk="update">Verificar atualizações (versão <span data-ver></span>)</button><button data-bk="senha">Alterar senha do Financeiro</button></div></div>';
/* Ponte com o programa: os dados ficam no arquivo do computador, protegidos pela senha do Financeiro. */
(function(){
 var KEY='dashboard_convites_v2',SYNC_KEYS=['dashboard_convites_v2_base','dashboard_convites_v2_sync'];
 var orig=Storage.prototype.setItem,origRm=Storage.prototype.removeItem,t=null,pend=null,blocked=false,empty=false;
 function wipe(){try{origRm.call(localStorage,KEY);SYNC_KEYS.forEach(function(k){origRm.call(localStorage,k)})}catch(e){}}
 var s=null;try{s=window.api.finLoadSync()}catch(e){}
 if(s==='LOCKED'){blocked=true;wipe();document.documentElement.style.visibility='hidden';window.api.ir('producao');}
 else if(s){try{orig.call(localStorage,KEY,s)}catch(e){}}
 else{wipe();empty=true}
 function mark(c,txt){var e=document.getElementById('appsave');if(e){e.className='appsave '+c;e.lastChild.textContent=txt}}
 function flush(){if(blocked||pend==null)return Promise.resolve();var p=pend;pend=null;mark('busy','Salvando…');
  return window.api.finSave(p).then(function(r){mark(r&&r.ok?'':'err',r&&r.ok?'Salvo no computador':'Erro ao salvar')})}
 Storage.prototype.setItem=function(k,v){orig.call(this,k,v);
  if(!blocked&&this===window.localStorage&&k===KEY){empty=false;pend=v;mark('busy','Salvando…');clearTimeout(t);t=setTimeout(flush,300)}};
 function leave(page){return flush().then(function(){wipe();return window.api.ir(page)})}
 window.__beforeUpdate=function(){return flush().then(wipe)};
 window.__shellNav=function(m){if(m==='financeiro')return;try{orig.call(localStorage,'pref_module',JSON.stringify(m))}catch(e){}leave('producao')};
 /* o Electron não tem a caixinha prompt(): o programa mostra a dele */
 window.prompt=function(msg,def){try{return window.api.perguntar(String(msg==null?'':msg),def==null?'':String(def))}catch(e){return null}};
 window.__busy=function(){return !!document.querySelector('.ov')};
 /* ao sair de um campo com conta (124,69+354,38), mostra o resultado (479,07) */
 document.addEventListener('focusout',function(e){var el=e.target;if(!el||el.tagName!=='INPUT'||!/\d\s*[+\-−–]\s*\d/.test(el.value)||typeof num!=='function')return;
  var v=num(el.value);if(isNaN(v))return;var dec=Math.round(v*100)%100!==0;el.value=v.toLocaleString('pt-BR',{minimumFractionDigits:dec?2:0,maximumFractionDigits:2})},true);
 /* dados do Financeiro que chegaram de outro aparelho pela nuvem: recarrega se não houver edição aberta */
 var remoto=false;
 function aplicaRemoto(){if(pend!=null||document.querySelector('.ov')){remoto=true;mark('busy','Atualização de outro aparelho: aplica ao fechar a janela');return}remoto=false;wipe();window.api.ir('financeiro')}
 if(window.api.onDadosRemotos)window.api.onDadosRemotos(function(p){if(p.indexOf('fin')>=0)aplicaRemoto()});
 setInterval(function(){if(remoto&&pend==null&&!document.querySelector('.ov'))aplicaRemoto()},2000);
 window.__toastNuvem=function(m){mark('',m)};
 window.addEventListener('beforeunload',function(){if(!blocked&&pend!=null){window.api.finSaveSync(pend);pend=null}wipe()});
 /* tranca sozinho depois de 15 minutos sem uso */
 var last=Date.now();['mousemove','mousedown','keydown','wheel'].forEach(function(ev){window.addEventListener(ev,function(){last=Date.now()},{passive:true})});
 setInterval(function(){if(Date.now()-last>15*60*1000)leave('producao')},30000);
 /* downloads: PDF, relatório e backup abrem a janela "Salvar como" do Windows */
 var dl={save:function(o){var d=o.data;
  var p=(d instanceof Blob)?d.arrayBuffer().then(function(b){return new Uint8Array(b)}):Promise.resolve(d);
  return p.then(function(x){return window.api.saveFile(o.filename,x)}).then(function(r){if(!r.ok){var e=new Error('declined');e.code='declined';throw e}})}};
 window.claude={use:function(n){return Promise.resolve(n==='downloads'?dl:null)}};
 function dialog(html){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg" style="max-width:440px">'+html+'</div>';document.body.appendChild(o);return o}
 function changePw(){
  var o=dialog('<h2>Alterar senha do Financeiro</h2><div class="sub">A nova senha passa a valer na próxima vez que você entrar.</div>'+
   '<div style="display:grid;gap:12px"><label>Senha atual<input id="cp0" type="password" autocomplete="off"></label><label>Nova senha<input id="cp1" type="password" autocomplete="off"></label><label>Repita a nova senha<input id="cp2" type="password" autocomplete="off"></label></div>'+
   '<p id="cperr" style="color:var(--r);min-height:18px;margin:10px 0 0"></p><div class="acts"><button class="btn ghost" data-cp="x">Cancelar</button><button class="btn" data-cp="ok">Salvar nova senha</button></div>');
  var g=function(id){return o.querySelector('#'+id)};g('cp0').focus();
  function go(){var a=g('cp1').value;if(a.length<4){g('cperr').textContent='A senha precisa ter pelo menos 4 caracteres.';return}
   if(a!==g('cp2').value){g('cperr').textContent='As duas senhas novas não são iguais.';return}
   window.api.senhaDefinir(a,g('cp0').value).then(function(r){if(!r.ok){g('cperr').textContent=r.error||'Não foi possível alterar.';return}o.remove();mark('','Senha alterada')})}
  o.addEventListener('click',function(e){var c=e.target.getAttribute('data-cp');if(c==='x'||e.target===o)o.remove();if(c==='ok')go()});
  o.addEventListener('keydown',function(e){if(e.key==='Enter')go();if(e.key==='Escape')o.remove()})}
 function doImport(){flush().then(function(){return window.api.importar()}).then(function(r){if(!r.ok){if(r.error)alert(r.error);return}
  var msg=r.kind==='fin'?'Este é um backup do Dashboard de Convites ('+r.turmas+' turmas).\n\nImportar SUBSTITUI todos os dados do Financeiro. A Produção não muda.'
   :'Backup completo com '+r.cards+' cartões de produção'+(r.hasFin?' e o Financeiro':'')+'.\n\nImportar SUBSTITUI os dados atuais'+(r.hasFin?' da Produção e do Financeiro':' da Produção')+'.';
  if(!confirm(msg+'\n\nO estado atual continua no backup automático de hoje. Continuar?'))return;
  window.api.aplicarImport().then(function(x){if(x.ok){wipe();window.api.ir('financeiro')}})})}
 document.addEventListener('DOMContentLoaded',function(){
  var sf=document.getElementById('sfootBtns');if(sf&&!document.getElementById('appsave')){sf.innerHTML=RODAPE;try{document.getElementById('appBk').innerHTML=ShellIcon('gear',15)+' Backup'}catch(e){}}
  if(blocked)return;var vazio=false;try{vazio=!S.turmas.length&&!S.parc.length}catch(e){vazio=empty}
  if(!vazio)return;
  var b=document.createElement('div');b.id='finEmpty';
  b.style.cssText='margin:16px 24px 0;padding:14px 16px;border:1px solid var(--teal);border-radius:12px;background:var(--pn);display:flex;gap:14px;align-items:center;flex-wrap:wrap';
  b.innerHTML='<div style="flex:1;min-width:240px"><b>O Financeiro ainda não tem dados.</b><div class="note" style="margin-top:4px">Importe o backup do Dashboard de Convites (arquivo .json) para trazer turmas, formandos, pagamentos, orçamentos e parceiros.</div></div><button class="btn" data-bk="import" style="margin:0">Importar backup</button>';
  var h=document.querySelector('header');if(h&&h.parentNode)h.parentNode.insertBefore(b,h.nextSibling)});
 document.addEventListener('click',function(e){
  var el=e.target,menu=document.getElementById('appMenu');
  var go=el.closest&&el.closest('[data-goto]');if(go){leave(go.dataset.goto);return}
  if(el.id==='appBk'){menu.hidden=!menu.hidden;return}
  if(menu&&!menu.hidden&&!(el.closest&&el.closest('.appmenuwrap')))menu.hidden=true;
  var bk=el.dataset&&el.dataset.bk;if(!bk)return;if(menu)menu.hidden=true;
  if(bk==='senha')return changePw();
  if(bk==='import')return doImport();
  flush().then(function(){
   if(bk==='pasta')return window.api.abrirBackups();
   if(bk==='update')return window.__checkUpdates&&window.__checkUpdates();
   if(bk==='export')return window.api.exportar().then(function(r){if(r.ok)alert('Backup salvo em:\n'+r.path);else if(r.error)alert(r.error)});
  })});
})();
</script>

/* Vegetal e Foto família: valor por unidade (global) × quantidade de cada formando.
   Esse valor é somado ao valor individual do formando. Começam vazios (0). */
const VU=()=>+S.vu||0;
const FF=()=>+S.ff||0;
function extraVF(a){return Math.round(((+a.qv||0)*VU()+(+a.qf||0)*FF())*100)/100}

/* cálculo de cada formando e de cada turma
   valor individual = base (automático ou digitado) + Vegetal + Foto família */
function lcalc(T,a){
 const auto=(+a.luxo||0)*T.lu+(+a.simp||0)*T.su+(+a.foto||0)*T.fu;
 const ov=a.vf!=null;
 const base=ov?a.vf:auto;
 const ex=extraVF(a);
 const vf=Math.round((base+ex)*100)/100;
 const pago=+a.pago||0;
 const rest=vf-pago;
 const sit=vf<=0?'':(pago>vf+0.005?'x':(pago>=vf-0.005?'ok':'w'));
 return{auto:auto,ov:ov,base:base,ex:ex,vf:vf,ent:+a.ent||0,pago:pago,rest:rest,sit:sit};
}
function syncT(t){
 let tt=0,rr=0;
 t.alunos.forEach(a=>{const c=lcalc(t,a);tt+=c.vf;rr+=c.pago});
 t.total=Math.round(tt*100)/100;
 t.rec=Math.round(rr*100)/100;
 t.form=t.alunos.length;
 t.luxo=sum(t.alunos,a=>a.luxo);
 t.simp=sum(t.alunos,a=>a.simp);
 t.foto=sum(t.alunos,a=>a.foto);
 t.unit=t.lu;t.ent=t.pe;
 t.col=stageOf(dv(t.rec,t.total));
}

/* regra antiga, usada nos modelos criados por você (sem referência) */
function orcBase(f,q){
 const i=QTDS.indexOf(q);
 if(f==='lacre')return 500+150*i;
 if(f==='corte'||f==='hot')return 600;
 if(f==='foto')return 6*q;
 return 0;
}
function orcBaseVal(m,f,q){
 const M=modelOf(m),rq=(M&&M.alias&&M.alias[q])||q,R=REF[m];
 if(!R)return orcBase(f,rq);
 const row=R.r.find(x=>x[0]===+rq);
 if(row)return RK[f]?row[RK[f]]:0;
 if(f==='lacre'||f==='hot'||f==='corte')return R.p[f];
 if(f==='foto')return R.p.f6?6*q:0;
 if(f==='lay')return 2750+250*Math.max(0,(q-100)/50);
 return 0;
}
function orcVal(m,q,i,f){
 if(f==='graf')return orcVal(m,q,i,'unit')*q;
 const k=ek(m,q,ORC_PER[i],f);
 if(S.orc.ed[k]!==undefined)return S.orc.ed[k];
 return Math.round(orcBaseVal(m,f,q)*(1+(S.orc.acr[i]||0)/100)*100)/100;
}
/* total = convite unitário × quantidade + Vegetal + Família + Layout + colunas extras + colunas novas.
   A coluna Gráfica só mostra unitário × quantidade e NÃO entra na soma. */
function orcTot(m,q,i){
 const M=modelOf(m);
 let s=OCOLS.reduce((s,c)=>c.k==='graf'?s:s+orcVal(m,q,i,c.k)*(c.k==='unit'?q:1),0);
 ((M&&M.xc)||[]).forEach(c=>{s+=orcVal(m,q,i,c.k)});
 return s;
}
/* linhas (quantidades) de um modelo */
function rowsOf(M){
 if(M.rows)return M.rows;
 const base=REF[M.id]?REF[M.id].r.map(x=>x[0]):QTDS.slice();
 const ks=Object.keys(S.orc.ed);
 QTDS.forEach(q=>{if(base.indexOf(q)<0&&ks.some(k=>k.indexOf(M.id+'|'+q+'|')===0))base.push(q)});
 return base.sort((a,b)=>a-b);
}
function materializeRows(M){if(!M.rows)M.rows=rowsOf(M).slice();return M.rows}
function moveQ(mid,o,n){
 const ed=S.orc.ed,pre=mid+'|'+o+'|';
 Object.keys(ed).forEach(k=>{if(k.indexOf(pre)===0){ed[mid+'|'+n+'|'+k.slice(pre.length)]=ed[k];delete ed[k]}});
}

/* valor do convite com parceiro, a partir do orçamento */
const defModelo=()=>{const m=S.orc.models.find(x=>/25x18/i.test(x.nome));return m?m.id:(S.orc.models[0]||{}).id};
const cardModelo=p=>(p.modelo&&modelOf(p.modelo))?p.modelo:defModelo();
const parcQtd=p=>(+p.qtd||0)||((+p.luxo||0)+(+p.simp||0));
function orcParceiro(mid,q,ano){
 const M=modelOf(mid);if(!M||!(q>0))return null;
 let i=ORC_PER.findIndex(p=>p.indexOf(String(ano))===0);if(i<0)i=S.orcP||0;
 const pts=rowsOf(M).map(r=>({q:r,t:orcTot(mid,r,i)})).filter(x=>x.t>0).sort((a,b)=>a.q-b.q);
 if(!pts.length)return null;
 const ex=pts.find(x=>x.q===q);
 let val,exact=false;
 if(ex){val=ex.t;exact=true}
 else{
  const lo=pts.slice().reverse().find(x=>x.q<q),hi=pts.find(x=>x.q>q);
  if(lo&&hi)val=lo.t+(hi.t-lo.t)*(q-lo.q)/(hi.q-lo.q);
  else{const n=lo||hi;val=n.t/n.q*q}
 }
 return{val:Math.round(val*100)/100,exact:exact,per:ORC_PER[i],nome:M.nome,q:q,
  ref:!Object.keys(S.orc.ed).some(k=>k.indexOf(mid+'|')===0)};
}

const UIKEYS=['v','tab','open','mcols','orcP','orcN','orcM','lrg','lqt','del','ts','fe','turmas','parc','lanc','orc'];
function flat(s){const m={},lf=(b,o,skip)=>{Object.keys(o||{}).forEach(k=>{if(skip&&skip.includes(k))return;if(o[k]!==undefined)m[b+'/'+k]=JSON.stringify(o[k])})};

function recEdits(){const nf=flat(S),now=Date.now();let ch=false;if(!S.fe)S.fe=legacyFe(S);
 if(window.__flat){for(const k in nf)if(window.__flat[k]!==nf[k]){S.fe[k]=now;ch=true}for(const k in window.__flat)if(!(k in nf)){S.fe[k]=now;ch=true}}
 window.__flat=nf;if(ch){S.ts=now;if(window.pushSoon)window.pushSoon()}return ch}
function mergeLWW(loc,rem){const cp=x=>JSON.parse(JSON.stringify(x)),fe=s=>s.fe||legacyFe(s),fl=fe(loc),fr=fe(rem),Fr=flat(rem);
 const pick=p=>{const a=fl[p]||0,b=fr[p]||0;return a>b?'l':(b>a?'r':(p in Fr?'r':'l'))};
 const D={};['t','p','l','a'].forEach(k=>{D[k]=[...new Set([...((loc.del&&loc.del[k])||[]),...((rem.del&&rem.del[k])||[])])]});
 const r=cp(loc);
 const mItem=(base,l,rm,skip)=>{const o={};new Set([...Object.keys(l),...Object.keys(rm)]).forEach(k=>{if(skip&&skip.includes(k))return;
   const a=l[k],b=rm[k];let v;if(a===undefined)v=b;else if(b===undefined)v=a;else v=pick(base+'/'+k)==='l'?a:b;if(v!==undefined)o[k]=cp(v)});return o};
 const mList=(base,L,R,dl,inner)=>{const lm=new Map(L.map(x=>[x.id,x])),rm=new Map(R.map(x=>[x.id,x])),out=[];
   [...L.map(x=>x.id),...R.map(x=>x.id).filter(i=>!lm.has(i))].forEach(id=>{if(dl.includes(id))return;const a=lm.get(id),b=rm.get(id);
     out.push(a&&b?inner(base+'/'+id,a,b):cp(a||b))});return out};
 r.turmas=mList('turmas',loc.turmas||[],rem.turmas||[],D.t,(bs,l,rm)=>{const t=mItem(bs,l,rm,['alunos']);t.alunos=mList(bs+'/alunos',l.alunos||[],rm.alunos||[],D.a,(b2,x,y)=>mItem(b2,x,y));return t});
 r.parc=mList('parc',loc.parc||[],rem.parc||[],D.p,(bs,l,rm)=>mItem(bs,l,rm));
 r.lanc=mList('lanc',loc.lanc||[],rem.lanc||[],D.l,(bs,l,rm)=>mItem(bs,l,rm));
 const lo=loc.orc||{},ro=rem.orc||{};r.orc=mItem('orc',lo,ro,['ed']);
 const ed={};new Set([...Object.keys(lo.ed||{}),...Object.keys(ro.ed||{})]).forEach(k=>{const a=(lo.ed||{})[k],b=(ro.ed||{})[k];const v=a===undefined?b:(b===undefined?a:(pick('orc/ed/'+k)==='l'?a:b));if(v!==undefined)ed[k]=v});r.orc.ed=ed;
 Object.keys(rem).forEach(k=>{if(UIKEYS.includes(k)||!('root/'+k in Fr))return;const a=loc[k],b=rem[k];r[k]=a===undefined?cp(b):(pick('root/'+k)==='l'?cp(a):cp(b))});
 const F={};new Set([...Object.keys(fl),...Object.keys(fr)]).forEach(k=>{F[k]=Math.max(fl[k]||0,fr[k]||0)});r.fe=F;r.del=D;r.v=loc.v;return r}

function lres(T){
 const r={n:T.alunos.length,luxo:0,simp:0,foto:0,vegq:0,ffq:0,veg:0,ff:0,vf:0,ent:0,pago:0,ok:0,w:0,x:0};
 T.alunos.forEach(a=>{const c=lcalc(T,a),qv=+a.qv||0,qf=+a.qf||0;
  r.luxo+=+a.luxo||0;r.simp+=+a.simp||0;r.foto+=+a.foto||0;
  r.vegq+=qv;r.ffq+=qf;
  r.veg+=VU()*qv;r.ff+=FF()*qf;
  r.vf+=c.vf;r.ent+=c.ent;r.pago+=c.pago;
  if(c.sit==='ok')r.ok++;else if(c.sit==='x')r.x++;else if(c.sit==='w')r.w++});
 r.rest=r.vf-r.pago;r.p=dv(r.pago,r.vf);
 return r}

function render(){
 if(lista!=null&&!turmaLista())lista=null;
 if(!(S.tab>=0&&S.tab<TABS.length))S.tab=0;
 const y=window.scrollY,sc={},lw0=document.querySelector('.lw'),lws=lw0?lw0.scrollLeft:0;

 try{html=lista!=null?vL():[v0,v1,v2,(window.v3x||v3),v4,v5,v6][S.tab]()}
 catch(err){html='<div class="panel"><h3 class="r">Erro ao montar a tela</h3><p>'+esc(err&&err.message)+'</p></div>'}
 document.getElementById('app').innerHTML=html;
 let mh='';
 try{mh=modal?mhtml():''}catch(err){mh='';modal=null}

 document.querySelectorAll('.mscroll').forEach(e=>e.scrollLeft=sc[e.dataset.m]||0);
 const lw1=document.querySelector('.lw');if(lw1)lw1.scrollLeft=lws;
 window.scrollTo(0,y);
 if(pendFocus!=null){const el=document.querySelector('[data-la="'+pendFocus+'|nome"]');if(el){el.focus();el.scrollIntoView({block:'center'})}pendFocus=null}
 recEdits();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setSticky()}

document.addEventListener('click',e=>{
 if(e.target.classList&&e.target.classList.contains('ov')){modal=null;return render()}
 const tb=e.target.closest('[data-tab]');
 if(tb){modal=null;lista=null;S.tab=+tb.dataset.tab;render();return window.scrollTo(0,0)}
 const b=e.target.closest('[data-act]');if(!b)return;
 const id=+b.dataset.id,a=b.dataset.act;

 /* orçamentos */
 if(a==='mcols')S.mcols[b.dataset.mid]=!S.mcols[b.dataset.mid];
 if(a==='addm'){const n=prompt('Nome do modelo (ex.: Convite 30x20 cm):');if(!n)return;const c=prompt('Descrição (ex.: Capa 3 partes):')||'';const mid='m'+Date.now();S.orc.models.push({id:mid,nome:n,capa:c});S.orcM=mid}
 if(a==='delm'){const m=S.orc.models.find(m=>m.id===b.dataset.mid);if(!m)return;
  if(!confirm('Deseja realmente excluir o modelo "'+m.nome+'"?'))return;
  S.orc.models=S.orc.models.filter(x=>x.id!==m.id);S.orcM=null}
 if(a==='addrow'){const M=modelOf(b.dataset.mid);if(!M)return;
  const q=Math.round(num(prompt('Quantidade de convites da nova linha:')));
  if(!(q>0))return;
  const rows=materializeRows(M);
  if(rows.indexOf(q)>=0){alert('Essa quantidade já existe nesta tabela.');return}
  rows.push(q);rows.sort((x,y)=>x-y)}
 if(a==='delrow'){const M=modelOf(b.dataset.mid),q=+b.dataset.q;if(!M)return;
  if(!confirm('Deseja realmente excluir a linha de '+q+' convites do modelo "'+M.nome+'"?'))return;
  const rows=materializeRows(M),pre=M.id+'|'+q+'|';
  M.rows=rows.filter(x=>x!==q);
  Object.keys(S.orc.ed).forEach(k=>{if(k.indexOf(pre)===0)delete S.orc.ed[k]});
  if(M.alias)delete M.alias[q]}
 if(a==='addcol'){const M=modelOf(b.dataset.mid);if(!M)return;
  const n=prompt('Nome da nova coluna:');if(!n||!n.trim())return;
  (M.xc=M.xc||[]).push({k:'x'+Date.now(),n:n.trim()})}
 if(a==='delcol'){const M=modelOf(b.dataset.mid),k=b.dataset.k;if(!M||!M.xc)return;
  const c=M.xc.find(x=>x.k===k);if(!c)return;
  if(!confirm('Deseja realmente excluir a coluna "'+c.n+'" do modelo "'+M.nome+'"?'))return;
  M.xc=M.xc.filter(x=>x.k!==k);
  Object.keys(S.orc.ed).forEach(key=>{const p=key.split('|');if(p[0]===M.id&&p[3]===k)delete S.orc.ed[key]})}

 /* convites com parceiros: calcular pelo orçamento (dentro da janela, sem perder o que foi digitado) */
 if(a==='calcparc'){
  const gv=k=>{const el=document.getElementById('p-'+k);return el?el.value:''};
  const mid=gv('modelo'),hint=document.getElementById('p-hint');
  let q=num(gv('qtd'));
  if(isNaN(q)||q<=0){const l=num(gv('luxo')),s=num(gv('simp'));q=(isNaN(l)?0:l)+(isNaN(s)?0:s)}
  const r=orcParceiro(mid,Math.round(q),Math.round(num(gv('ano'))));
  if(!r){if(hint)hint.textContent='Não foi possível calcular: informe a quantidade de convites (ou luxo/simplificado) e confira se o modelo tem valores na aba Orçamentos.';return}
  const cur=num(gv('total')),old=modal.id==null?null:S.parc.find(p=>p.id===modal.id),prev=old?(old.auto||0):0;
  if(cur>0&&Math.abs(cur-prev)>0.005&&Math.abs(cur-r.val)>0.005){
   if(!confirm('Já existe um valor digitado em "Valor total" ('+BRL(cur)+'). Substituir por '+BRL(r.val)+'?'))return}
  document.getElementById('p-total').value=fmtIn(r.val);
  modal.ci=r;
  if(hint)hint.textContent='Modelo '+r.nome+', '+r.q+' convites, período '+r.per+': '+BRL(r.val)+(r.exact?' (linha exata da tabela)':' (valor calculado, a quantidade não é uma linha da tabela)')+(r.ref?' · valores de referência, ainda não editados':'')+'. Clique em Salvar para aplicar.';
  return}
 /* recalcular um cartão já salvo */
 if(a==='recalcp'){
  const p=S.parc.find(x=>x.id===id);if(!p)return;
  const r=orcParceiro(cardModelo(p),Math.round(parcQtd(p)),yP(p));
  if(!r){alert('Não foi possível calcular. Use "Editar pagamento" para informar a quantidade de convites e o modelo, e confira se o modelo tem valores na aba Orçamentos.');return}
  if(p.total>0&&Math.abs(p.total-(p.auto||0))>0.005&&Math.abs(p.total-r.val)>0.005){
   if(!confirm('O valor total deste cartão ('+BRL(p.total)+') foi digitado manualmente. Substituir por '+BRL(r.val)+' (modelo '+r.nome+', '+r.q+' convites'+(r.exact?'':', valor calculado')+')?'))return}
  p.total=r.val;p.auto=r.val;p.calc=!r.exact;p.rec=Math.min(+p.rec||0,p.total)}

 /* janelas */
 if(a==='info')modal={t:'info',id:id};
 if(a==='edit')modal={t:'edit',id:id};
 if(a==='pinfo')modal={t:'pinfo',id:id};
 if(a==='parc')modal={t:'parc',id:b.dataset.id===undefined?null:id,mes:b.dataset.mes===undefined?null:+b.dataset.mes,ano:b.dataset.ano===undefined?null:+b.dataset.ano};
 if(a==='close')modal=null;

 /* lista de formandos */
 if(a==='lista'){lista=id;modal=null;render();return window.scrollTo(0,0)}
 if(a==='lvoltar')lista=null;
 if(a==='lrg')S.lrg=!S.lrg;
 if(a==='lqt')S.lqt=!S.lqt;
 if(a==='addl'){const t=turmaLista();if(!t)return;const nid=Date.now();
  t.alunos.push({id:nid,nome:'',rg:'',cpf:'',tel:'',luxo:0,simp:0,foto:0,veg:0,qv:0,qf:0,vf:null,ent:0,pago:0,forma:''});
  syncT(t);pendFocus=nid}
 if(a==='dela'){const t=turmaLista();if(!t)return;const al=t.alunos.find(x=>x.id===+b.dataset.aid);if(!al)return;
  if(!confirm('Deseja realmente excluir o formando "'+(al.nome||'sem nome')+'" da lista?'))return;
  t.alunos=t.alunos.filter(x=>x.id!==al.id);syncT(t)}

 /* nova turma */
 if(a==='addt'){const c=prompt('Curso da turma (ex.: Medicina):');if(!c)return;
  const p=prompt('Período (ex.: 2027.1):','2027.1')||'';const l=prompt('Nome da lista:','Lista')||'Lista';const an=parseInt(p,10);
  const nt=mkTurma({id:Date.now(),curso:c,per:p,lista:l,ano:isNaN(an)?ANO_PADRAO:an,lu:0,su:0,fu:0,pe:25,custo:0,rows:[]});
  syncT(nt);S.turmas.push(nt);lista=nt.id;modal=null;render();return window.scrollTo(0,0)}

 /* exclusões (sempre com confirmação) */
 if(a==='delt'){const x=S.turmas.find(t=>t.id===id);if(!x)return;
  if(!confirm('Deseja realmente excluir a turma "'+x.curso+' · '+x.per+' ('+x.lista+')"?\n\nOs valores dela deixarão de somar nos totais.'))return;
  S.turmas=S.turmas.filter(t=>t.id!==id);modal=null}
 if(a==='delpc'){const x=S.parc.find(p=>p.id===id);if(!x)return;
  if(!confirm('Deseja realmente excluir o convite com parceiro "'+x.nome+'"?\n\nOs valores dele deixarão de somar nos totais.'))return;
  S.parc=S.parc.filter(p=>p.id!==id);modal=null}
 if(a==='delparc'){const x=S.parc.find(p=>p.id===modal.id);
  if(!confirm('Deseja realmente excluir o convite com parceiro'+(x?' "'+x.nome+'"':'')+'?'))return;
  S.parc=S.parc.filter(p=>p.id!==modal.id);modal=null}
 if(a==='del'){const l=S.lanc.find(l=>l.id===id);if(!l)return;
  if(!confirm('Deseja realmente excluir a despesa "'+l.desc+'" ('+BRL(l.valor)+')?'))return;
  S.lanc=S.lanc.filter(l=>l.id!==id)}

 /* salvar */
 if(a==='saveed'){const x=S.turmas.find(t=>t.id===modal.id);const el=document.getElementById('ed-custo');
  const cv=el?num(el.value):NaN;
  if(!isNaN(cv)&&cv<0){alert('O custo não pode ser negativo.');return}
  if(x){x.custo=isNaN(cv)?0:cv;const pe2=document.getElementById('ed-pe'),en2=document.getElementById('ed-entv'),pv=pe2?num(pe2.value):NaN,ev2=en2?num(en2.value):NaN;
  if(!isNaN(pv)&&(pv<0||pv>100)){alert('A entrada combinada deve ficar entre 0 e 100%.');return}
  if(!isNaN(ev2)&&ev2<0){alert('O valor da entrada não pode ser negativo.');return}
  if(pe2)x.pe=isNaN(pv)?0:pv;if(en2)x.entv=isNaN(ev2)?0:ev2}
  modal=null}
 if(a==='saveparc'){
  const gt=k=>document.getElementById('p-'+k).value.trim(),g=k=>num(gt(k));
  const nome=gt('nome'),parceiro=gt('parc'),data=gt('data'),mes=+document.getElementById('p-mes').value,mid=document.getElementById('p-modelo').value;
  const av=g('ano'),tv=g('total'),rv=g('rec'),cv=g('custo'),uv=g('unit'),ev=g('ent'),qv=g('qtd'),evv=g('entv');
  if(!nome){alert('Informe o cliente ou a turma.');return}
  if(isNaN(av)||av<2000||av>2100){alert('Informe o ano da turma (por exemplo, 2027).');return}
  if(!isNaN(tv)&&tv<0){alert('O valor total não pode ser negativo.');return}
  if(!isNaN(rv)&&rv<0){alert('Informe um valor recebido válido.');return}
  if(!isNaN(cv)&&cv<0){alert('O custo não pode ser negativo.');return}
  if(!isNaN(uv)&&uv<0){alert('O valor unitário não pode ser negativo.');return}
  if(!isNaN(ev)&&(ev<0||ev>100)){alert('A entrada combinada deve ficar entre 0 e 100%.');return}
  let T=isNaN(tv)?0:tv;const R0=isNaN(rv)?0:rv;
  if(T===0&&R0>0){alert('Informe o valor total antes do valor recebido.');return}
  const old=modal.id==null?null:S.parc.find(p=>p.id===modal.id);
  const dados={nome:nome,parceiro:parceiro,data:data,mes:mes,ano:Math.round(av),custo:isNaN(cv)?0:cv,unit:isNaN(uv)?0:uv,ent:isNaN(ev)?0:ev,entv:(isNaN(evv)||evv<0)?null:evv,modelo:mid,qtd:isNaN(qv)||qv<0?0:Math.round(qv)};
  ['form','luxo','simp','foto'].forEach(k=>{const v=g(k);dados[k]=isNaN(v)||v<0?0:Math.round(v)});
  let auto=0,calc=false;
  if(modal.ci&&Math.abs(T-modal.ci.val)<0.005){auto=T;calc=!modal.ci.exact}
  else if(old&&T>0&&Math.abs(T-(old.auto||0))<0.005){auto=old.auto;calc=!!old.calc}
  else if(!(T>0)){
   /* valor total vazio: nada digitado à mão para proteger, então aplica o valor do orçamento */
   const r=orcParceiro(mid,dados.qtd||(dados.luxo+dados.simp),dados.ano);
   if(r){T=r.val;auto=T;calc=!r.exact}}
  dados.total=T;dados.rec=Math.min(R0,T);dados.auto=auto;dados.calc=calc;
  if(modal.id==null)S.parc.push(Object.assign({id:Date.now()},dados));
  else Object.assign(S.parc.find(p=>p.id===modal.id),dados);
  modal=null}

 /* despesas */
 if(a==='add'&&window.__vmAdd){return window.__vmAdd('s')}
 if(a==='add'){const d=prompt('Descrição da despesa:');if(!d)return;const v=num(prompt('Valor (R$):'));if(v>0)S.lanc.push({id:Date.now(),desc:d,valor:v,pago:false})}
 if(a==='tog'){const l=S.lanc.find(l=>l.id===id);if(l)l.pago=!l.pago}
 render()});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});

/* edição da lista de formandos: atualiza na hora, sem perder o cursor */
document.addEventListener('input',e=>{
 const t=e.target,T=turmaLista();if(!T)return;
 if(t.dataset.la){
  const par=t.dataset.la.split('|'),a=T.alunos.find(x=>x.id===+par[0]),f=par[1];if(!a)return;
  if(['nome','rg','cpf','tel','forma'].includes(f))a[f]=t.value;
  else if(['luxo','simp','foto','qv','qf'].includes(f)){const v=parseInt(t.value,10);a[f]=isNaN(v)||v<0?0:v}
  else if(f==='vf'){const v=num(t.value);a.vf=isNaN(v)||v<0?null:v}
  else{const v=num(t.value),nv=isNaN(v)||v<0?0:v;
   if(f==='ent'){const oe=+a.ent||0,op=+a.pago||0;
    if((oe>0&&op>=oe-0.005)||(oe===0&&op===0)){a.pago=Math.round(Math.max(0,op+(nv-oe))*100)/100;
     const pi=document.querySelector('[data-la="'+a.id+'|pago"]');if(pi&&document.activeElement!==pi)pi.value=a.pago?fmtIn(a.pago):''}}
   a[f]=nv}
  lpatch()}
 else if(t.dataset.lp){const v=num(t.value);T[t.dataset.lp]=isNaN(v)||v<0?0:v;lpatch()}
 else if(t.dataset.gp){const v=num(t.value);S[t.dataset.gp]=isNaN(v)||v<0?0:v;lpatch()}});

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.gp){t.value=S[t.dataset.gp]?fin(S[t.dataset.gp]):'';return}
 if(t.dataset.sel==='mod'){S.orcM=t.value;return render()}
 if(t.dataset.la||t.dataset.lp){
  const T=turmaLista();if(!T)return;
  lpatch();
  if(t.dataset.la&&t.dataset.la.endsWith('|vf')){const a=T.alunos.find(x=>x.id===+t.dataset.la.split('|')[0]);if(a){const c=lcalc(T,a);t.value=c.vf?fin(c.vf):''}}
  if(t.dataset.lp==='pe')t.value=T.pe?fin(T.pe)+'%':'';
  else if(t.dataset.lp)t.value=T[t.dataset.lp]?fin(T[t.dataset.lp]):'';
  return}
 /* orçamentos: alterar a quantidade de uma linha */
 if(t.dataset.oq){
  const p=t.dataset.oq.split('|'),M=modelOf(p[0]),o=+p[1],n=Math.round(num(t.value));
  if(!M)return;
  if(!(n>0))return render();
  const rows=materializeRows(M);
  if(n!==o){
   if(rows.indexOf(n)>=0){alert('Essa quantidade já existe nesta tabela.');return render()}
   rows[rows.indexOf(o)]=n;rows.sort((x,y)=>x-y);
   moveQ(M.id,o,n);
   M.alias=M.alias||{};
   M.alias[n]=M.alias[o]||o;
   delete M.alias[o]}
  return render()}
 if(t.dataset.oi){const p=t.dataset.oi.split('|');const k=ek(p[0],p[1],ORC_PER[S.orcP],p[2]),v=num(t.value);
  if(isNaN(v))delete S.orc.ed[k];else S.orc.ed[k]=v;return render()}
 if(t.dataset.ac!==undefined){const v=num(t.value);S.orc.acr[+t.dataset.ac]=isNaN(v)?0:v;return render()}
 if(t.dataset.sel==='per'){S.orcP=+t.value;return render()}
 const k=t.dataset.in;if(!k)return;
 const v=num(t.value);S[k]=isNaN(v)?0:v;render()});

/* arrastar e soltar */
let dragId=null,dragK='t';
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.cardk[data-id]');if(c&&c.draggable){dragId=+c.dataset.id;dragK=c.dataset.k||'t';c.classList.add('drag')}});
document.addEventListener('dragend',()=>{document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col[data-col]');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.col[data-col]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',e=>{
 const c=e.target.closest&&e.target.closest('.col[data-col]');if(!c||dragId===null)return;
 e.preventDefault();
 const ano=c.dataset.year?+c.dataset.year:null;
 if(dragK==='p'){const p=S.parc.find(t=>t.id===dragId);if(p){p.mes=+c.dataset.col;if(ano)p.ano=ano}}
 else{const t=S.turmas.find(t=>t.id===dragId);if(t&&(ano==null||yT(t)===ano))t.col=+c.dataset.col}
 dragId=null;render()});

/* ===== sincronização na conta (db) e backup ===== */
(function(){
 const DEV=Math.random().toString(36).slice(2),CH=100000;trackDel();if(!S.fe)S.fe=legacyFe(S);window.__flat=flat(S);
 let db=null,pushT=null,busy=false,again=false,ro=false,LS=+(localStorage.getItem('dashboard_convites_v2_sync')||0);
 const setSt=(t,c)=>{const e=document.getElementById('syncst');if(e){e.textContent=t;e.style.color=c||''}};
 const valid=o=>o&&o.v===2&&Array.isArray(o.turmas)&&Array.isArray(o.parc)&&o.orc;
 const adopt=o=>{if(!valid(o))return false;S=o;if(!S.orc.ed)S.orc.ed={};S.turmas.forEach(syncT);if(!S.fe)S.fe=legacyFe(S);window.__flat=flat(S);window.__ids=null;trackDel();lista=null;modal=null;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();return true};
 const readRemote=async()=>{const m=await db.doc('sync/meta').get();if(!m.exists)return null;const d=m.data();let js='';
  for(let i=0;i<d.n;i++){const c=await db.doc('sync/c'+i).get();if(!c.exists)return null;js+=c.data().s}return{ts:d.ts,js:js}};
 const stamp=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 const ask=(msg,opts)=>new Promise(res=>{const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg"><h2>Sincronização</h2><p class="note">'+msg+'</p><div class="acts" style="flex-wrap:wrap">'+opts.map((x,i)=>'<button class="btn '+(x[2]||'')+'" data-i="'+i+'">'+x[0]+'</button>').join('')+'</div></div>';o.onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){o.remove();res(opts[i][1])}};document.body.appendChild(o)});
 const fdt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 const push=async()=>{if(!db||ro)return;if(busy){again=true;return}busy=true;setSt('Sincronizando…');
  try{if(!S.ts)S.ts=Date.now();const ts=S.ts,js=JSON.stringify(S),n=Math.ceil(js.length/CH);
   for(let i=0;i<n;i++)await db.doc('sync/c'+i).set({s:js.slice(i*CH,(i+1)*CH)});
   await db.doc('sync/meta').set({ts:ts,n:n,dev:DEV});try{localStorage.setItem('dashboard_convites_v2_base',JSON.stringify(S))}catch(e){}LS=ts;try{localStorage.setItem('dashboard_convites_v2_sync',String(ts))}catch(e){}setSt('✓ Sincronizado às '+stamp(),'var(--g)')}
  catch(e){if(e&&e.code==='invalid_argument'){ro=true;setSt('Somente leitura: sem permissão para gravar na nuvem','var(--o)')}else setSt('Erro ao sincronizar. Os dados continuam salvos neste aparelho.','var(--r)')}
  busy=false;if(again){again=false;push()}};
 window.pushSoon=()=>{if(db)setSt('Alterações não sincronizadas. Clique em Sincronizar.','var(--o)')};
 const J=x=>JSON.stringify(x);
 const m3=(b,l,r,tl,tr)=>{const jl=J(l),jr=J(r),jb=J(b);if(jl===jr)return l;if(jl===jb)return r;if(jr===jb)return l;return tl>=tr?l:r};
 const mObj=(b,l,r,tl,tr,skip)=>{const o={};new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{if(skip&&skip.includes(k))return;const v=m3(b?b[k]:undefined,l[k],r[k],tl,tr);if(v!==undefined)o[k]=v});return o};
 const mList=(B,L,R,tl,tr,inner)=>{const bm=new Map((B||[]).map(x=>[x.id,x])),lm=new Map(L.map(x=>[x.id,x])),rm=new Map(R.map(x=>[x.id,x])),out=[];
  [...new Set([...L.map(x=>x.id),...R.map(x=>x.id)])].forEach(id=>{const b=bm.get(id),l=lm.get(id),r=rm.get(id);
   if(l&&r)out.push(inner(b,l,r));else if(l){if(!(b&&J(b)===J(l)))out.push(l)}else if(r){if(!(b&&J(b)===J(r)))out.push(r)}});return out};
 const merge3=(loc,rem)=>{let base=null;try{base=JSON.parse(localStorage.getItem('dashboard_convites_v2_base'))}catch(e){}
  if(!valid(base))base=null;const tl=base?(loc.ts||0):-1,tr=rem.ts||0,o={};
  new Set([...Object.keys(loc),...Object.keys(rem)]).forEach(k=>{if(['turmas','parc','lanc','orc','del','ts'].includes(k))return;const v=m3(base?base[k]:undefined,loc[k],rem[k],tl,tr);if(v!==undefined)o[k]=v});
  const f=(b,l,r)=>mObj(b,l,r,tl,tr);
  o.turmas=mList(base&&base.turmas,loc.turmas,rem.turmas,tl,tr,(b,l,r)=>{const t=mObj(b,l,r,tl,tr,['alunos']);t.alunos=mList(b&&b.alunos,l.alunos||[],r.alunos||[],tl,tr,f);return t});
  o.parc=mList(base&&base.parc,loc.parc,rem.parc,tl,tr,f);
  o.lanc=mList(base&&base.lanc,loc.lanc||[],rem.lanc||[],tl,tr,f);
  const lo=loc.orc,ro2=rem.orc,bo=base&&base.orc;o.orc=mObj(bo,lo,ro2,tl,tr,['ed']);
  const ed={};new Set([...Object.keys(lo.ed||{}),...Object.keys(ro2.ed||{})]).forEach(k=>{const v=m3(bo&&bo.ed?bo.ed[k]:undefined,(lo.ed||{})[k],(ro2.ed||{})[k],tl,tr);if(v!==undefined)ed[k]=v});o.orc.ed=ed;
  o.del={t:[],p:[],l:[],a:[]};o.v=loc.v;return o};
 const syncNow=async()=>{if(!db){alert('Sincronização indisponível neste ambiente.');return}if(busy)return;setSt('Sincronizando…');
  try{const r=await readRemote();if(!r){await push();return}
   const rm=JSON.parse(r.js);if(!valid(rm)){await push();return}
   if(r.ts===(S.ts||0)){setSt('✓ Já estava sincronizado às '+stamp(),'var(--g)');return}
   const m=mergeLWW(S,rm);m.ts=Date.now();adopt(m);await push()}
  catch(e){setSt('Erro ao sincronizar. Os dados continuam salvos neste aparelho.','var(--r)')}};
 const syncNowOld=async()=>{if(!db){alert('Sincronização indisponível neste ambiente.');return}if(busy)return;setSt('Sincronizando…');
  try{const r=await readRemote(),L=S.ts||0;
   if(!r){await push();return}
   if(r.ts===L){LS=L;try{localStorage.setItem('dashboard_convites_v2_sync',String(L))}catch(e){}setSt('✓ Já estava sincronizado às '+stamp(),'var(--g)');return}
   const lc=L>LS,rc=r.ts>LS;let useRemote;
   if(lc&&rc){const ch=await ask('Existem alterações neste aparelho (última em '+fdt(L)+') e na nuvem (última em '+fdt(r.ts)+'). Qual versão você quer manter? A outra será substituída.',[['Usar a da nuvem','remote'],['Manter a deste aparelho','local','ghost'],['Cancelar',null,'ghost']]);if(!ch){setSt('Sincronização cancelada.','var(--o)');return}useRemote=ch==='remote'}
   else if(rc&&!lc)useRemote=true;else if(lc&&!rc)useRemote=false;else useRemote=r.ts>L;
   if(useRemote){if(adopt(JSON.parse(r.js))){LS=r.ts;try{localStorage.setItem('dashboard_convites_v2_sync',String(LS))}catch(e){}setSt('✓ Dados da nuvem carregados às '+stamp(),'var(--g)')}}
   else await push()}
  catch(e){setSt('Erro ao sincronizar. Os dados continuam salvos neste aparelho.','var(--r)')}};
 document.getElementById('bsync').onclick=syncNow;
 const pull=async first=>{try{const r=await readRemote();
   if(!r){if(first)push();return}
   if(r.ts>(S.ts||0)){if(adopt(JSON.parse(r.js)))setSt('✓ Dados da nuvem carregados às '+stamp(),'var(--g)')}
   else if(first&&(S.ts||0)>r.ts)push();else if(first)setSt('✓ Sincronizado às '+stamp(),'var(--g)')}
  catch(e){setSt('Erro ao ler a nuvem. Usando os dados deste aparelho.','var(--r)')}};
 (async()=>{try{if(window.claude&&claude.use)db=await claude.use('db')}catch(e){db=null}
  if(!db){setSt('Só neste aparelho (sincronização indisponível aqui)');return}
  setSt((S.ts||0)>LS?'Alterações não sincronizadas. Clique em Sincronizar.':'Clique em Sincronizar para atualizar com a nuvem.',(S.ts||0)>LS?'var(--o)':'');
  })();
 document.getElementById('bkx').onclick=async()=>{
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}
  if(!dl){alert('Exportar o backup não está disponível neste ambiente.');return}
  try{await dl.save({filename:'backup-dashboard-convites-'+new Date().toISOString().slice(0,10)+'.json',data:JSON.stringify(S)})}
  catch(e){if(!e||e.code!=='declined')alert('Não foi possível salvar o arquivo de backup.')}};
 const bkf=document.getElementById('bkf');
 document.getElementById('bki').onclick=()=>bkf.click();
 bkf.onchange=()=>{const f=bkf.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const o=JSON.parse(r.result);if(!valid(o))throw 0;
   if(!(await ask('Importar este backup vai substituir TODOS os dados atuais do painel, inclusive na nuvem.',[['Importar e substituir','ok'],['Cancelar',null,'ghost']])))return;
   adopt(o);save()}catch(e){alert('Arquivo de backup inválido.')}bkf.value=''};r.readAsText(f)};
})();

render();
