<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Cristiano Convites</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tema.css">
</head>
<body class="withside">
<aside id="side" aria-label="Menu"></aside>

<!-- ===== Dashboard ===== -->
<section class="module" id="mod-dashboard" hidden></section>

<!-- ===== Demandas (produção) ===== -->
<section class="module mod-dem" id="mod-demandas" hidden>
 <aside class="subside" id="subside" aria-label="Etapas e clientes"></aside>
 <div class="modmain">
  <header class="pagehead">
   <span class="phicon" data-icon="demandas"></span>
   <div><h1>Demandas</h1><small id="demSub">Produção dos convites</small></div>
   <nav class="views" id="views" aria-label="Visualização">
    <button data-view="overview">Visão geral</button>
    <button data-view="quadro" class="on">Quadro</button>
    <button data-view="lista">Lista</button>
    <button data-view="calendario">Calendário</button>
   </nav>
   <span class="phsp"></span>
   <button class="btn ghost sm" id="bCfg">Configurar quadro</button>
   <button class="btn sm" id="bNew" title="Ctrl+N">+ Novo pedido</button>
  </header>
  <main>
   <div id="banner"></div>
   <div class="filters">
    <input type="search" id="fq" placeholder="Buscar pedido…" title="Buscar (Ctrl+F)" aria-label="Buscar">
    <select id="fr" aria-label="Responsável"></select>
    <select id="fp" aria-label="Prioridade"><option value="">Prioridade</option><option value="alta">Prioridade alta</option><option value="media">Prioridade média</option><option value="baixa">Prioridade baixa</option></select>
    <select id="fe" aria-label="Etiqueta"></select>
    <label class="tog"><input type="checkbox" id="fl"> Só atrasados</label>
    <label class="tog"><input type="checkbox" id="fh"> Ocultar entregues</label>
    <span class="note" id="fcount"></span>
   </div>
   <section id="vOverview" hidden></section>
   <section id="vQuadro"><div class="board" id="board"></div></section>
   <section id="vLista" hidden><div class="listbar" id="listbar"></div><div class="tablewrap"><table class="tbl" id="tbl"></table></div></section>
   <section id="vCal" hidden></section>
  </main>
 </div>
</section>

<!-- ===== Contratos ===== -->
<section class="module" id="mod-contratos" hidden></section>

<!-- ===== Clientes ===== -->
<section class="module" id="mod-clientes" hidden></section>

<!-- menu de backup (abre a partir do rodapé do menu lateral) -->
<div class="menu sidemenu" id="menu" hidden>
 <button data-m="export">Exportar backup (tudo)…</button>
 <button data-m="import">Importar backup…</button>
 <button data-m="pasta">Abrir pasta de backups automáticos</button>
 <button data-m="update">Verificar atualizações (versão <span data-ver></span>)</button>
</div>

<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script src="shell.js"></script>
<script src="agenda-core.js"></script>
<script src="app.js"></script>
<script src="agenda.js"></script>
<script src="extenso.js"></script>
<script src="dashboard.js"></script>
<script src="clientes.js"></script>
<script src="contratos.js"></script>
<script src="update.js"></script>
</body>
</html>
