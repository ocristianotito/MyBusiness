<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Cristiano Convites</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
 <div class="hbar">
  <div class="brand"><b id="brandName">Cristiano Convites</b></div>
  <div class="modsw" role="tablist" aria-label="Área"><button class="on" aria-selected="true">Produção</button><button data-goto="financeiro">Financeiro</button></div>
  <nav class="views" id="views" aria-label="Visualização">
   <button data-view="quadro" class="on">Quadro</button>
   <button data-view="lista">Lista</button>
   <button data-view="calendario">Calendário</button>
  </nav>
  <div class="hsp"></div>
  <div class="sync" id="sync"><i></i><span>Carregando…</span></div>
  <div class="menuwrap">
   <button class="btn ghost sm" id="bMenu" aria-haspopup="true" aria-expanded="false">Backup ▾</button>
   <div class="menu" id="menu" hidden>
    <button data-m="export">Exportar backup (produção + financeiro)…</button>
    <button data-m="import">Importar backup…</button>
    <button data-m="pasta">Abrir pasta de backups automáticos</button>
    <button data-m="update">Verificar atualizações (versão <span data-ver></span>)</button>
   </div>
  </div>
  <button class="btn ghost sm" id="bCfg">Configurar quadro</button>
  <button class="btn sm" id="bNew" title="Ctrl+N">+ Novo pedido</button>
 </div>
</header>
<main>
 <div id="banner"></div>
 <div class="kpis" id="kpis"></div>
 <div class="filters">
  <input type="search" id="fq" placeholder="Buscar turma, curso, observação…  (Ctrl+F)" aria-label="Buscar">
  <select id="fr" aria-label="Responsável"></select>
  <select id="fp" aria-label="Prioridade"><option value="">Todas as prioridades</option><option value="alta">Prioridade alta</option><option value="media">Prioridade média</option><option value="baixa">Prioridade baixa</option></select>
  <select id="fe" aria-label="Etiqueta"></select>
  <label class="tog"><input type="checkbox" id="fl"> Só atrasados</label>
  <label class="tog"><input type="checkbox" id="fh"> Ocultar entregues</label>
  <span class="note" id="fcount"></span>
 </div>
 <section id="vQuadro"><div class="board" id="board"></div></section>
 <section id="vLista" hidden><div class="tablewrap"><table class="tbl" id="tbl"></table></div></section>
 <section id="vCal" hidden></section>
</main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script src="agenda-core.js"></script>
<script src="app.js"></script>
<script src="agenda.js"></script>
<script src="update.js"></script>
</body>
</html>
