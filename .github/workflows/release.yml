# Gera o instalador do Windows e publica a Release quando a versão do package.json muda na main.
# A Release (tag vX.Y.Z) leva o latest.yml que o programa instalado consulta para se atualizar sozinho.
# Também dá para rodar à mão em Actions → Publicar versão → Run workflow.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ver se esta versão já foi publicada
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A versão v$v já está publicada; nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ver.outputs.skip != 'true'
        run: npm ci

      - name: Gerar instalador e publicar Release
        if: steps.ver.outputs.skip != 'true'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
